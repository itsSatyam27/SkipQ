name: Diagnose V9 fingerprint inputs
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/verify-ota.yml]
permissions:
  contents: read
concurrency:
  group: skipq-production-ota
  cancel-in-progress: false
jobs:
  release_v9:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 544f8cd6b6e3d64348c65776b8c0c0540e609086
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - run: npm test
      - run: npm ci --no-audit --no-fund
      - run: npm install --global eas-cli@27.2.0 --no-audit --no-fund
      - name: Ensure no Android production build is pending
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas build:list --platform android --channel production --limit 50 --json --non-interactive > "$RUNNER_TEMP/builds.json"
          node <<'NODE'
          const fs = require('fs');
          const builds = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/builds.json','utf8'));
          if (builds.some(b => ['NEW','IN_QUEUE','IN_PROGRESS','PENDING_CANCEL'].includes(b.status))) throw new Error('Wait for pending production builds.');
          NODE
      - name: Compare stored native fingerprints
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas fingerprint:compare 0ba1fe33fc7542b9591f4f2ccbcc203c41010b54 98ba7ae63c265b4b3925c5ca268013c76d8f9984 --json --non-interactive > "$RUNNER_TEMP/diff.json"
          node <<'NODE'
          const fs = require('fs');
          const j = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/diff.json', 'utf8'));
          const a = new Map(j.fingerprint1.sources.map(s => [s.filePath || s.id, s]));
          const b = new Map(j.fingerprint2.sources.map(s => [s.filePath || s.id, s]));
          const changes = [...new Set([...a.keys(), ...b.keys()])].filter(k => a.get(k)?.hash !== b.get(k)?.hash);
          console.log(JSON.stringify(changes.map(k => ({path:k,old:a.get(k)?.hash,new:b.get(k)?.hash})),null,2));
          NODE
