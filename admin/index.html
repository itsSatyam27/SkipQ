<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkipQ · Admin</title><link rel="stylesheet" href="./style.css"></head>
<body><div id="app"><main class="login"><div class="brand">Q<span>SkipQ</span></div><p>Loading your workspace…</p></main></div><dialog id="action-dialog"><form id="action-form"><h2 id="action-title"></h2><p id="action-description"></p><label for="reason">Reason</label><textarea id="reason" required maxlength="500" rows="3" placeholder="Add a short note for the action history"></textarea><label id="duration-label" for="duration">Block duration</label><select id="duration"><option value="24">24 hours</option><option value="168">7 days</option><option value="720">30 days</option></select><p id="action-error" role="alert"></p><div class="dialog-actions"><button type="button" id="cancel-action" class="secondary">Cancel</button><button id="confirm-action">Confirm</button></div></form></dialog><dialog id="offboard-dialog"><form id="offboard-form"><h2>Mark as left university</h2><p id="offboard-account"></p><p>This disables sign-in and preserves the account, orders, and admin history. The action is recorded.</p><div id="seller-offboard-fields" hidden><label for="seller-action">Canteen handover</label><select id="seller-action"><option value="close">Close canteen</option><option value="transfer">Transfer to another approved seller</option></select><label id="successor-label" for="successor">Successor</label><select id="successor"></select><small id="seller-action-note">The canteen will be closed. Existing orders must be resolved first.</small></div><label for="offboard-reason">Reason</label><textarea id="offboard-reason" required maxlength="500" rows="3" placeholder="Add a short note for the admin history"></textarea><p id="offboard-error" role="alert"></p><div class="dialog-actions"><button type="button" id="cancel-offboard" class="secondary">Cancel</button><button id="confirm-offboard" class="danger">Confirm offboarding</button></div></form></dialog><script src="./config.js"></script><script type="module" src="./app.js"></script></body></html>
