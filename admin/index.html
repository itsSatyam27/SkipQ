<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkipQ · Admin</title><link rel="stylesheet" href="./style.css"></head>
<body><div id="app"><main class="login"><div class="brand">Q<span>SkipQ</span></div><p>Loading your workspace…</p></main></div><dialog id="action-dialog"><form id="action-form"><h2 id="action-title"></h2><p id="action-description"></p><label for="reason">Reason</label><textarea id="reason" required maxlength="500" rows="3" placeholder="Add a short note for the action history"></textarea><label id="duration-label" for="duration">Block duration</label><select id="duration"><option value="24">24 hours</option><option value="168">7 days</option><option value="720">30 days</option></select><p id="action-error" role="alert"></p><div class="dialog-actions"><button type="button" id="cancel-action" class="secondary">Cancel</button><button id="confirm-action">Confirm</button></div></form></dialog><script src="./config.js"></script><script type="module" src="./app.js"></script></body></html>
