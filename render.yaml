services:
  - type: web
    name: skipq-push
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm install --prefix push-server
    startCommand: npm --prefix push-server start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
